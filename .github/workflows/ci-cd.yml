name: TravelLog Server CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize]
    branches:
      - main
    paths-ignore:
      - 'README.md'

env:
  IMAGE_NAME: ajithnp/travel-log-backend

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Login to Docker Hub
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image (PR verify)
        if: github.event_name == 'pull_request'
        run: docker build -t ${{ env.IMAGE_NAME }}:test .

      - name: Build and Push Docker image
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          docker build \
            -t ${{ env.IMAGE_NAME }}:${{ github.sha }} \
            -t ${{ env.IMAGE_NAME }}:latest \
            .
          docker push ${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker push ${{ env.IMAGE_NAME }}:latest

  # Deploy job
  deploy:
    name: Deploy to EC2
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    runs-on: ubuntu-latest

    steps:

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          script: |
            cd /home/ubuntu/Travel-Log-Api
            
            # Pull the latest Docker image from DockerHub

            docker pull ${{ env.IMAGE_NAME }}:${{ github.sha }}

            # Delete the old container if it exists

            if [ "$(docker ps -a -q -f name=travellog-backend-container)" ]; then
              docker rm -f travellog-backend-container
              echo "Old container deleted."
            else
              echo "No old container found, skipping..."
            fi

            # Run a new container from the pulled image

            docker run -d \
              -p 3001:3001 \
              --name travellog-backend-container \
              --restart unless-stopped \
              --env-file /home/ubuntu/Travel-Log-Api/.env \
              ${{ env.IMAGE_NAME }}:${{ github.sha }}

            # Health check

            echo "Waiting for container to start..."
            sleep 15

            response=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3001/health)

            if [ "$response" = "200" ]; then
              echo "✅ Deployment successful!"
            else
              echo "❌ Health check failed! Response: $response"
              docker rm -f travellog-backend-container
              docker run -d \
                -p 3001:3001 \
                --name travellog-backend-container \
                --restart unless-stopped \
                --env-file /home/ubuntu/Travel-Log-Api/.env \
                ${{ env.IMAGE_NAME }}:latest
              exit 1
            fi

            # Cleanup old images

            docker image prune -f